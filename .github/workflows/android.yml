# Fabrique l'APK Android à chaque mise à jour de main et le publie
# dans les "Releases" du dépôt : à télécharger directement depuis le téléphone.
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Construire l'app web et la copier dans Android
        run: |
          npm run build
          npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Kairo.apk"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kairo 1.0.${{ github.run_number }}
          body: |
            Sur ton téléphone : télécharge **Kairo.apk** ci-dessous, ouvre-le, puis autorise l'installation.
            Commit : ${{ github.sha }}
          files: Kairo.apk
          make_latest: true
